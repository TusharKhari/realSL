<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Building 2D CAD Editor with Snapping & Dimensions</title>

  <style>
    :root {
      --bg-color: #0f172a;
      --panel-bg: rgba(30, 41, 59, 0.9);
      --panel-border: rgba(255, 255, 255, 0.12);
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --warning: #f59e0b;
      --danger: #f43f5e;
      --success: #10b981;
      --snap-purple: #c084fc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    #canvas {
      width: 100vw;
      height: 100vh;
      display: block;
      background: #090d16;
      cursor: default;
      user-select: none;
    }

    #canvas.pan-mode { cursor: grab; }
    #canvas.pan-mode:active { cursor: grabbing; }
    #canvas.move-mode { cursor: move; }
    #canvas.crosshair-mode { cursor: crosshair; }

    /* Grid & Axes */
    .grid-line { stroke: #1e293b; stroke-width: 1; }
    .grid-line-major { stroke: #334155; stroke-width: 1.5; }
    .axis-x { stroke: #0284c7; stroke-width: 2; }
    .axis-y { stroke: #10b981; stroke-width: 2; }
    .axis-label { font-family: monospace; font-size: 10px; fill: #64748b; }
    .origin-label { font-family: monospace; font-size: 11px; fill: #38bdf8; font-weight: bold; }

    /* Wall Styling */
    .wall-front { fill: #475569; stroke: #0f172a; stroke-width: 1; transition: fill 0.15s; }
    .wall-side { fill: #334155; stroke: #0f172a; stroke-width: 1; transition: fill 0.15s; }
    .wall-top { fill: #64748b; stroke: #0f172a; stroke-width: 1; transition: fill 0.15s; }
    .wall-selected { fill: #f59e0b !important; stroke: #b45309 !important; stroke-width: 3 !important; }

    .wall-line-simple { stroke: #38bdf8; stroke-width: 4; stroke-linecap: round; }
    .wall-plan { fill: #334155; stroke: #94a3b8; stroke-width: 1.5; }
    .wall-centerline { stroke: #38bdf8; stroke-width: 1; stroke-dasharray: 2 2; }
    .wall-label { font-size: 11px; fill: #f8fafc; font-weight: bold; text-anchor: middle; }

    /* Room Styling */
    .room-plan { fill: rgba(56, 189, 248, 0.12); stroke: rgba(56, 189, 248, 0.4); stroke-width: 1.5; stroke-dasharray: 4; }
    .room-label { font-size: 13px; fill: #38bdf8; font-weight: 700; text-anchor: middle; }
    .room-info { font-size: 11px; fill: #94a3b8; text-anchor: middle; }

    /* Door & Window Styling */
    .door-panel { fill: rgba(245, 158, 11, 0.5); stroke: #f59e0b; stroke-width: 1.5; }
    .door-plan { fill: none; stroke: #f59e0b; stroke-width: 2; }
    .door-arc { fill: none; stroke: #f59e0b; stroke-width: 1.5; stroke-dasharray: 3 3; }
    .door-label, .window-label { font-size: 10px; fill: #f59e0b; font-weight: 600; text-anchor: middle; }
    .window-opening { fill: rgba(16, 185, 129, 0.3); stroke: #10b981; stroke-width: 2; }
    .window-glass { fill: rgba(16, 185, 129, 0.4); stroke: #10b981; stroke-width: 1.5; }

    /* CAD Dimension Rendering */
    .dim-line { stroke: #38bdf8; stroke-width: 1.5; }
    .dim-ext-line { stroke: rgba(56, 189, 248, 0.5); stroke-width: 1; stroke-dasharray: 2 2; }
    .dim-arrow { fill: #38bdf8; stroke: #38bdf8; }
    .dim-label { font-family: monospace; font-size: 11px; fill: #38bdf8; font-weight: bold; text-anchor: middle; }

    /* Snap Markers & Guide Lines */
    .snap-marker-endpoint { fill: #10b981; stroke: #047857; stroke-width: 2; }
    .snap-marker-intersection { fill: #c084fc; stroke: #7e22ce; stroke-width: 2; }
    .snap-marker-grid { fill: #38bdf8; stroke: #0284c7; stroke-width: 1.5; }
    .snap-angle-guide { stroke: #38bdf8; stroke-width: 1.5; stroke-dasharray: 3 3; }
    .snap-label { font-family: monospace; font-size: 10px; fill: #f8fafc; font-weight: 600; text-anchor: middle; }

    /* Toolbar */
    #toolbar {
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    #toolbar button {
      border: 1px solid rgba(255,255,255,0.1);
      background: #334155;
      color: #f8fafc;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    #toolbar button:hover { background: #475569; }
    #toolbar button.active { background: var(--accent); color: #0f172a; border-color: var(--accent); font-weight: 600; }
    #toolbar button.btn-danger { background: rgba(244, 63, 94, 0.2); color: #fecdd3; border-color: #f43f5e; }
    #toolbar button.btn-danger:hover { background: #f43f5e; color: #fff; }

    /* Snapping Toolbar Bar */
    #snap-bar {
      position: fixed;
      top: 65px;
      left: 15px;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 6px 14px;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      font-size: 11px;
      color: var(--text-muted);
    }

    #snap-bar label {
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      color: var(--text-color);
      font-weight: 500;
    }

    #snap-bar input[type="checkbox"] {
      accent-color: var(--accent);
      cursor: pointer;
    }

    /* Selection Properties Panel */
    #properties {
      position: fixed;
      right: 15px;
      top: 15px;
      width: 270px;
      z-index: 20;
      padding: 16px;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      font-size: 13px;
    }

    #properties h3 {
      margin-bottom: 12px;
      font-size: 14px;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .property-row {
      margin-bottom: 10px;
    }

    .property-row label {
      display: block;
      margin-bottom: 4px;
      color: var(--text-muted);
      font-size: 11px;
    }

    .property-row input {
      width: 100%;
      padding: 6px 10px;
      background: #090d16;
      color: #38bdf8;
      border: 1px solid var(--panel-border);
      border-radius: 4px;
      font-family: monospace;
      font-size: 12px;
    }

    .property-row input:focus {
      outline: none;
      border-color: var(--accent);
    }

    /* Live JSON Panel */
    #json-panel {
      position: fixed;
      left: 15px;
      bottom: 15px;
      width: 420px;
      max-height: 250px;
      z-index: 20;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    #json-title {
      padding: 8px 14px;
      font-weight: 600;
      font-size: 12px;
      color: var(--text-muted);
      background: #1e293b;
      border-bottom: 1px solid var(--panel-border);
      display: flex;
      justify-content: space-between;
    }

    #json-output {
      margin: 0;
      padding: 12px;
      max-height: 200px;
      overflow: auto;
      font-family: "Fira Code", monospace;
      font-size: 11px;
      color: #38bdf8;
      background: #090d16;
    }

    /* Status Bar */
    #status {
      position: fixed;
      bottom: 15px;
      right: 15px;
      padding: 8px 16px;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      z-index: 20;
    }
  </style>
</head>

<body>

  <!-- Top Toolbar -->
  <div id="toolbar">
    <button id="select-tool" class="active" title="Select and inspect elements">👆 Select</button>
    <button id="pan-tool" title="Pan workspace">✋ Pan</button>
    <button id="move-tool" title="Move wall on canvas">↔️ Move</button>
    <button id="new-wall-tool" title="Draw new wall with snapping">➕ New Wall</button>
    <button id="delete-tool" class="btn-danger" title="Delete selected wall">🗑️ Delete</button>

    <div style="width: 1px; height: 20px; background: var(--panel-border); margin: 0 4px;"></div>

    <span style="font-size: 11px; color: var(--text-muted);">View:</span>
    <button id="mode-simple-btn">2D Lines</button>
    <button id="mode-plan-btn">2D Plan</button>
    <button id="mode-isometric-btn" class="active">2.5D</button>

    <div style="width: 1px; height: 20px; background: var(--panel-border); margin: 0 4px;"></div>
    <a href="3d.html" style="text-decoration:none;"><button type="button" style="background: var(--accent); color: #0f172a; font-weight: bold; cursor: pointer;">🏢 3D View</button></a>
  </div>

  <!-- Snapping & Dimension Bar -->
  <div id="snap-bar">
    <strong style="color: var(--accent);">🧲 Snapping:</strong>
    <label><input type="checkbox" id="snap-grid-cb" checked> Grid (0.25m)</label>
    <label><input type="checkbox" id="snap-endpoints-cb" checked> Endpoints</label>
    <label><input type="checkbox" id="snap-intersections-cb" checked> Intersections</label>
    <label><input type="checkbox" id="snap-angles-cb" checked> Angles (45°/90°)</label>

    <div style="width: 1px; height: 16px; background: var(--panel-border);"></div>
    <label><input type="checkbox" id="show-dimensions-cb" checked> CAD Dimensions</label>
  </div>

  <!-- Selection Property Inspector -->
  <div id="properties">
    <h3>Selection</h3>
    <div id="property-content">Nothing selected.</div>
  </div>

  <!-- Live Exported JSON Panel -->
  <div id="json-panel">
    <div id="json-title">
      <span>CURRENT BUILDING JSON</span>
      <span style="font-size: 10px; color: var(--success);">Model Output</span>
    </div>
    <pre id="json-output"></pre>
  </div>

  <!-- Status Bar -->
  <div id="status">Ready</div>

  <!-- Interactive SVG Canvas -->
  <svg id="canvas">
    <g id="camera">
      <g id="grid"></g>
      <g id="rooms"></g>
      <g id="building"></g>
      <g id="doors"></g>
      <g id="windows"></g>
      <g id="dimensions"></g>
      <g id="selection"></g>
      <g id="new-wall-preview"></g>
      <g id="snap-indicators"></g>
    </g>
  </svg>

  <script type="module" src="./app.js"></script>

</body>
</html>
